# Start only after RabbitMQ and PostgreSQL are up (they used to start with only
# After=network.target and came up ~15 s before RabbitMQ after a reboot: the
# first requests that queued an alarm e-mail failed with "Connection refused").
# postgresql.service is Ubuntu's wrapper; postgresql@16-main.service is the real
# cluster unit (After= on a unit that does not exist is ignored).
#
# Install for gunicorn, celerybeat and fetch-fuel-data:
#   for u in gunicorn celerybeat fetch-fuel-data; do
#     sudo mkdir -p /etc/systemd/system/$u.service.d
#     sudo cp deploy/systemd/dropins/10-wait-for-broker-db.conf /etc/systemd/system/$u.service.d/
#   done
#   sudo systemctl daemon-reload
[Unit]
Wants=network-online.target rabbitmq-server.service postgresql.service
After=network-online.target rabbitmq-server.service postgresql.service postgresql@16-main.service
