# Mosquitto settings for the server MQTT listeners (Phase M, step M6).
# Place in /etc/mosquitto/conf.d/ (mosquitto.conf must have `include_dir /etc/mosquitto/conf.d`
# and must not already set these keys). Do not remove the existing listener / bridge stanzas.

# Keep sessions and queued messages across broker restarts.
persistence true
persistence_location /var/lib/mosquitto/
autosave_interval 60

# The server listeners connect with clean_session=False and subscribe at QoS 1,
# so the broker queues their messages while a listener is restarting.
persistent_client_expiration 7d
max_queued_messages 200000
# Gateways currently publish at QoS 0; without this the broker would not queue
# those messages for a disconnected persistent subscriber.
queue_qos0_messages true
